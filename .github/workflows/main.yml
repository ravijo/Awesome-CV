name: Compile PDFs and DOCX

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    # Fonts for the PDFs; python3-docx and python3-fonttools for
    # scripts/cv2docx.py, which writes a DOCX next to each CV PDF
    # (same packages as the Dockerfile)
    - name: Install dependencies
      run: |
        apt update
        apt install --yes \
          fonts-roboto \
          fonts-adobe-sourcesans3 \
          python3-docx \
          python3-fonttools \
          ;

    - name: Compile
      run: make

    - uses: actions/upload-artifact@v6
      with:
        name: examples
        path: |
          examples/*.pdf
          examples/*.docx
